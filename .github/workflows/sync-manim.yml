# 把 zuemen/zuemen 用 Manim 算好的專案動畫同步進 public/videos/
# （動畫原始碼與算圖在 zuemen/zuemen 的 manim/，這裡只負責搬檔；有變動才 commit，Vercel 會自動部署）
name: sync-manim

on:
  schedule:
    - cron: "41 19 * * *"      # 每天台北時間 03:41
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch rendered explainers from zuemen/zuemen
        uses: actions/checkout@v5
        with:
          repository: zuemen/zuemen
          path: _manim
          sparse-checkout: assets/manim

      - name: Copy into public/videos
        run: |
          # 只同步網站有用到 Manim 動畫的專案（沒有實錄 demo 的那幾個）
          for slug in rwa-tokenization qml-simulation; do
            for f in "$slug.mp4" "$slug.webp" "$slug-preview.mp4"; do
              cp "_manim/assets/manim/$f" "public/videos/$f"
            done
          done
          rm -rf _manim

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync Manim explainers from zuemen/zuemen"
            git push
          fi
