# 把 zuemen/zuemen 用 Manim 算好的專案動畫同步進 public/videos/
# （動畫原始碼與算圖在 zuemen/zuemen 的 manim/，這裡只負責搬檔）
# 只能手動觸發，而且只推到 manim-sync 分支、不碰 main：看過畫面再合併，免得沒審就上線。
name: sync-manim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch rendered explainers from zuemen/zuemen
        uses: actions/checkout@v5
        with:
          repository: zuemen/zuemen
          path: _manim
          sparse-checkout: assets/manim

      - name: Copy into public/videos
        run: |
          # 只同步網站有用到 Manim 動畫的專案（沒有實錄 demo 的那幾個）
          command -v ffprobe >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; }
          for slug in rwa-tokenization qml-simulation; do
            for f in "$slug.mp4" "$slug.webp" "$slug-preview.mp4"; do
              cp "_manim/assets/manim/$f" "public/videos/$f"
            done
            # 片長不會自動寫回 src/data/projects.ts 的 seconds：印出來，合併前手動對一次
            secs=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "public/videos/$slug.mp4")
            printf -- '- %s: %.1f s（對照 projects.ts 的 seconds）\n' "$slug" "$secs" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -rf _manim

      - name: Push to manim-sync if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if git diff --cached --quiet; then
            echo "no changes" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: sync Manim explainers from zuemen/zuemen"
            git push --force origin HEAD:manim-sync
            echo "Review and merge: https://github.com/${{ github.repository }}/compare/main...manim-sync" >> "$GITHUB_STEP_SUMMARY"
          fi
